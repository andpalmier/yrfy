name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23"

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (Snapshot)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

      # GoReleaser stamps the version with -X. The linker silently drops a -X
      # naming a symbol that does not exist, so a wrong package path fails
      # without any error and every released binary reports "dev" forever.
      # Running the binary GoReleaser just built is what catches that.
      - name: Assert the release build stamps its version
        run: |
          bin=$(find dist -type f -name yrfy -perm -u+x | head -n1)
          if [ -z "$bin" ]; then
            echo "::error::no yrfy binary found under dist/"
            exit 1
          fi
          out=$("$bin" version)
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -q 'version dev'; then
            echo "::error::version not stamped; check the -X symbol paths in .goreleaser.yml"
            exit 1
          fi
          if printf '%s\n' "$out" | grep -q 'unknown'; then
            echo "::error::commit or build date not stamped; check the -X symbol paths"
            exit 1
          fi
