# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: yrfy

before:
  hooks:
    - go mod tidy

builds:
  - id: yrfy
    main: .
    binary: yrfy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/andpalmier/yrfy/cmd.Version={{.Version}}
      - -X github.com/andpalmier/yrfy/cmd.Commit={{.ShortCommit}}
      - -X github.com/andpalmier/yrfy/cmd.BuildDate={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"

homebrew_casks:
  - name: yrfy
    repository:
      owner: andpalmier
      name: homebrew-tap
    homepage: "https://github.com/andpalmier/yrfy"
    description: "CLI tool to interact with YARAify API"
    directory: Casks
    # Homebrew quarantines what a cask downloads, and these binaries are neither
    # signed nor notarized, so macOS refuses to run them with "yrfy is damaged
    # and cannot be opened". Clearing the quarantine attribute bypasses
    # Gatekeeper: Apple may withdraw it, and signing plus notarization is the
    # durable answer, but that needs an Apple Developer account.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/yrfy"]
          end

# One "docker buildx build" across both platforms, pushed as a single
# multi-platform image. A client pulling the tag gets the manifest for its own
# architecture, so there are no per-architecture tags to publish or stitch back
# together.
dockers_v2:
  - id: yrfy
    images:
      - "ghcr.io/andpalmier/yrfy"
    tags:
      - "{{ .Version }}"
      # "latest" must never move onto a prerelease. An empty tag is ignored.
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "CLI tool to interact with YARAify API"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "https://github.com/andpalmier/yrfy"
      org.opencontainers.image.licenses: "AGPL-3.0"

release:
  github:
    owner: andpalmier
    name: yrfy
  draft: false
  prerelease: auto
